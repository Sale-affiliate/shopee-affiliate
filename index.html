  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #cfe0e7;

    }

    .container {
      max-width: 600px;

    h1 {

    .card {
      background: white;
      padding: 16px;
      border-radius: 14px;

      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #000;
      transition: transform .15s ease;
    }

    .card:hover {
      transform: scale(1.02);
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #ffe066;

    /* Flash sale blinking */
    .flash {
      animation: flashBlink 1.1s infinite;
    }

    @keyframes flashBlink {
      0% { background-color: #ffe066; }
      50% { background-color: #ff9f00; }
      100% { background-color: #ffe066; }
    }

    /* Bao lì xì rung */
    .lixi {
      position: fixed;
      width: 42px;
      bottom: 20px;
      right: 20px;
      animation: shake 1.8s infinite;
      z-index: 999;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(3deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-3deg); }
      100% { transform: rotate(0deg); }
    }

    /* Linh vật ngựa 2026 */
    .horse {
      position: fixed;
      left: 10px;
      bottom: 10px;
      width: 80px;
      opacity: 0.9;
    }
  </style>
